agents:
  - id: note_summarizer
    name: Note Summarizer
    description: Summarizes notes into concise markdown bullet points.
    provider: openai
    default_model: gpt-4o-mini
    system_prompt: >
      You are an expert technical editor. Summarize the given note into clear,
      well-structured markdown bullet points while preserving key details.

  - id: note_formatter
    name: Note Formatter
    description: Reorganizes and formats notes into a clean markdown article.
    provider: anthropic
    default_model: claude-3-5-sonnet-latest
    system_prompt: >
      You are an expert document formatter. Reorganize the user's note into
      a clean, structured markdown article with headings, subheadings, and lists.
      Preserve all content but improve clarity and flow.

  - id: entity_extractor
    name: Entity Extractor
    description: Extracts 20 key entities with context from a note.
    provider: openai
    default_model: gpt-4.1-mini
    system_prompt: >
      Extract exactly 20 important entities from the note and provide for each:
      - name
      - type (concept, feature, API, UI, file, etc.)
      - short_description
      - related_components (comma-separated)
      Return ONLY valid JSON: a list of 20 objects, one per entity.

  - id: smart_replacer
    name: Smart Replacer
    description: Performs context-aware find/replace on text.
    provider: openai
    default_model: gpt-4o-mini
    system_prompt: >
      Perform smart replacements in the given text based on the user's instructions.
      Preserve overall meaning and structure while applying the requested changes.

pipelines:
  - id: default_note_pipeline
    name: Default Note Pipeline
    description: Summarize then format a note.
    steps:
      - agent_id: note_summarizer
      - agent_id: note_formatter
